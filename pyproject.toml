[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "resume-tailoring"
version = "2.0.0"
description = "Autonomous, evidence-based resume agent (Track 6 hackathon)"
requires-python = ">=3.9"
keywords = ["resume", "tailoring", "ATS", "agentic", "AI", "hackathon"]

dependencies = [
    "fpdf2==2.8.7",
    "PyPDF2>=3.0.1",
    "requests>=2.28.0",
    "pydantic-settings>=2.0.0",
    "streamlit>=1.30.0",
]

[project.scripts]
jdp_parser = "jdp_parser:main"
resume_tailor = "resume_tailor:main"
evaluate_resume = "evaluate_resume:main"
revisor = "revisor:main"
change_report = "change_report:main"

[project.urls]
Homepage = "https://github.com/v9102/-hackathon_track6"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --ignore=tests/test_basic.py"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
py-modules = [
    "jdp_parser",
    "resume_tailor",
    "evaluate_resume",
    "revisor",
    "change_report",
    "main",
    "dashboard",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff.lint]
ignore = ["EXE002"]