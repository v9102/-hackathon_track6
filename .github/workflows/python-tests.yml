name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check .

      - name: Type Check with MyPy
        run: |
          pip install mypy
          mypy main.py dashboard.py jdp_parser.py resume_tailor.py evaluate_resume.py revisor.py change_report.py

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Run Tests
        run: |
          pytest tests/ -v

      - name: Pipeline Smoke Test
        run: |
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended
          python -m app.main run > /tmp/pipeline.out 2>&1
          cat /tmp/pipeline.out
          test "$(ls storage/runs/*/tailored_resume_final.pdf | wc -l)" -ge 1
          grep -q "Verification       : True" /tmp/pipeline.out